      - name: Test and compile signed release
        id: apk
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.KINERA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kinera-src"
          bash tests/run.sh
          if [[ -z "$SIGNING_BUNDLE" ]]; then
            echo '::error::Missing KINERA_SIGNING_BUNDLE repository secret. Configure the permanent signing key before building.'
            exit 1
          fi
          IFS=: read -r KINERA_STORE_PASSWORD KEYSTORE_BASE64 <<< "$SIGNING_BUNDLE"
          test -n "$KINERA_STORE_PASSWORD" && test -n "$KEYSTORE_BASE64"
          echo "::add-mask::$KINERA_STORE_PASSWORD"
          echo "::add-mask::$KEYSTORE_BASE64"
          export KINERA_STORE_PASSWORD
          export KINERA_KEY_PASSWORD="$KINERA_STORE_PASSWORD"
          export KINERA_KEY_ALIAS=kinera
          export KINERA_KEYSTORE="$RUNNER_TEMP/kinera-release.p12"
          umask 077
          trap 'rm -f "$KINERA_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KINERA_KEYSTORE"
          unset SIGNING_BUNDLE KEYSTORE_BASE64
          gradle --no-daemon --stacktrace :app:assembleRelease :app:lintRelease
          APK=app/build/outputs/apk/release/app-release.apk
          NAME=Kinera_Edit_v5.4.0_release.apk
          EXPECTED_CERT=47dc21b24c06909c980423fddc2f796269ecf43890de113e0753a6a3eae53e26
          CERT_OUTPUT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL_CERT=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          if [[ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo '::error::APK signer does not match the permanent Kinera Edit certificate.'
            exit 1
          fi
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | sed -n '1,8p'
          printf '%s\n' "$BADGING" | grep -F "package: name='meteapps.kineraedit' versionCode='45' versionName='5.4.0'" > /dev/null
          printf '%s\n' "$BADGING" | grep -qxF "sdkVersion:'31'"
          if printf '%s\n' "$BADGING" | grep -q '^application-debuggable'; then
            echo '::error::Release APK must not be debuggable.'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/$NAME"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum "$NAME" > SHA256SUMS.txt
          zip -q Kinera_Edit_v5.4.0_release.zip "$NAME" SHA256SUMS.txt
          test -s Kinera_Edit_v5.4.0_release.zip
          echo 'kind=release-signed' >> "$GITHUB_OUTPUT"
      - name: Upload lint diagnostics when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kinera-v5.4-lint-diagnostics
          path: ${{ runner.temp }}/kinera-src/app/build/reports/lint-results-*
          if-no-files-found: ignore
      - name: Upload compiled APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Kinera-Edit-v5.4-APK
          path: dist/*
          if-no-files-found: error
      - name: Publish direct APK download as prerelease
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_KIND: ${{ steps.apk.outputs.kind }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v5.4.0-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Kinera Edit v5.4.0 ($BUILD_KIND)" --notes "Compiled and signature-verified by CI. Not yet validated on physical Android devices. Retired neural audio is removed from the app; private importer files are cleaned at startup. Permanent signer verified. Keep signing secret backed up. No Creator Rewards eligibility guarantee."
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in Kinera_Edit_v5.4.0_release.apk Kinera_Edit_v5.4.0_release.zip SHA256SUMS.txt; do
            printf '%s\n' "$ASSETS" | grep -qxF "$asset" || { echo "::error::Missing release asset: $asset"; exit 1; }
          done
      - name: Verify build and delivery completed
        if: always()
        shell: bash
        env:
          COMPILE_RESULT: ${{ steps.apk.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          test "$COMPILE_RESULT" = success
          test "$UPLOAD_RESULT" = success
          test "$PUBLISH_RESULT" = success
          test -s dist/Kinera_Edit_v5.4.0_release.apk
          test -s dist/Kinera_Edit_v5.4.0_release.zip
          (cd dist && sha256sum -c SHA256SUMS.txt)
