# Kinera Edit v8.1.0: small workflow; source archive committed separately.
# No third-party service credentials or signing keys are embedded.
# A persistent signing secret is required; the expected certificate is pinned.
name: Kinera Edit Android APK v8.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kinera-build.yml', 'kinera-source.zip']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Reject incomplete workflow copies
        shell: bash
        run: |
          set -euo pipefail
          grep -qxF '# KINERA_WORKFLOW_COMPLETE_V81' .github/workflows/kinera-build.yml || { echo '::error::Incomplete workflow. Copy the full file including its final marker.'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify or install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
            if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
              SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            fi
            test -x "$SDKMANAGER"
            missing=()
            [[ -f "$ANDROID_HOME/platforms/android-35/android.jar" ]] || missing+=('platforms;android-35')
            if [[ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]]; then missing+=('build-tools;35.0.0'); fi
            for attempt in 1 2 3; do
              if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "${missing[@]}"; then break; fi
              if [[ "$attempt" == 3 ]]; then echo '::error::Android SDK install failed after three attempts. Check runner SDK availability.'; exit 1; fi
              sleep "$((attempt * 5))"
            done
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify and restore exact Android source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$GITHUB_WORKSPACE/kinera-source.zip"
          test -f "$SOURCE" || { echo '::error::Upload kinera-source.zip to the repository root before running this workflow.'; exit 1; }
          printf '%s  %s\n' 'b5e859b8981770c4884058ba0834d14994f3fc40554b56243b09ec94c5571f3c' "$SOURCE" | sha256sum -c -
          unzip -tq "$SOURCE"
          mkdir -p "$RUNNER_TEMP/kinera-src"
          unzip -q "$SOURCE" -d "$RUNNER_TEMP/kinera-src"
          test -f "$RUNNER_TEMP/kinera-src/app/build.gradle"
      - name: Test and compile signed release
        id: apk
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.KINERA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kinera-src"
          bash tests/run.sh
          if [[ -z "$SIGNING_BUNDLE" ]]; then
            echo '::error::Missing KINERA_SIGNING_BUNDLE repository secret. Configure the permanent signing key before building.'
            exit 1
          fi
          IFS=: read -r KINERA_STORE_PASSWORD KEYSTORE_BASE64 <<< "$SIGNING_BUNDLE"
          test -n "$KINERA_STORE_PASSWORD" && test -n "$KEYSTORE_BASE64"
          echo "::add-mask::$KINERA_STORE_PASSWORD"
          echo "::add-mask::$KEYSTORE_BASE64"
          export KINERA_STORE_PASSWORD
          export KINERA_KEY_PASSWORD="$KINERA_STORE_PASSWORD"
          export KINERA_KEY_ALIAS=kinera
          export KINERA_KEYSTORE="$RUNNER_TEMP/kinera-release.p12"
          umask 077
          trap 'rm -f "$KINERA_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KINERA_KEYSTORE"
          unset SIGNING_BUNDLE KEYSTORE_BASE64
          gradle --no-daemon --stacktrace :app:assembleRelease :app:lintRelease
          APK=app/build/outputs/apk/release/app-release.apk
          NAME=Kinera_Edit_v8.1.0_release.apk
          EXPECTED_CERT=47dc21b24c06909c980423fddc2f796269ecf43890de113e0753a6a3eae53e26
          CERT_OUTPUT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL_CERT=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          if [[ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo '::error::APK signer does not match the permanent Kinera Edit certificate.'
            exit 1
          fi
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | sed -n '1,8p'
          printf '%s\n' "$BADGING" | grep -F "package: name='meteapps.kineraedit' versionCode='72' versionName='8.1.0'" > /dev/null
          printf '%s\n' "$BADGING" | grep -qxF "sdkVersion:'31'"
          if printf '%s\n' "$BADGING" | grep -q '^application-debuggable'; then
            echo '::error::Release APK must not be debuggable.'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/$NAME"
          python3 tests/apk_single_audit.py "$GITHUB_WORKSPACE/dist/$NAME" "$GITHUB_WORKSPACE/dist/APK_SIZE_REPORT.json"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum "$NAME" APK_SIZE_REPORT.json > SHA256SUMS.txt
          zip -q Kinera_Edit_v8.1.0_release.zip "$NAME" SHA256SUMS.txt APK_SIZE_REPORT.json
          test -s Kinera_Edit_v8.1.0_release.zip
          echo 'kind=release-signed' >> "$GITHUB_OUTPUT"
      - name: Upload lint diagnostics when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kinera-v8.1-lint-diagnostics
          path: ${{ runner.temp }}/kinera-src/app/build/reports/lint-results-*
          if-no-files-found: ignore
      - name: Upload compiled APK artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Kinera-Edit-v8.1-APK
          path: dist/*
          if-no-files-found: error
      - name: Publish direct APK download as prerelease
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_KIND: ${{ steps.apk.outputs.kind }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v8.1.0-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Kinera Edit v8.1.0 ($BUILD_KIND)" --notes "Compiled and signature-verified by CI. Not yet validated on physical Android devices. Retired neural audio is removed from the app; private importer files are cleaned at startup. Permanent signer verified. Keep signing secret backed up. No Creator Rewards eligibility guarantee."
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in Kinera_Edit_v8.1.0_release.apk Kinera_Edit_v8.1.0_release.zip SHA256SUMS.txt APK_SIZE_REPORT.json; do
            printf '%s\n' "$ASSETS" | grep -qxF "$asset" || { echo "::error::Missing release asset: $asset"; exit 1; }
          done
      - name: Verify build and delivery completed
        if: always()
        shell: bash
        env:
          COMPILE_RESULT: ${{ steps.apk.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          test "$COMPILE_RESULT" = success
          test "$UPLOAD_RESULT" = success
          test "$PUBLISH_RESULT" = success
          test -s dist/Kinera_Edit_v8.1.0_release.apk
          test -s dist/APK_SIZE_REPORT.json
          test -s dist/Kinera_Edit_v8.1.0_release.zip
          (cd dist && sha256sum -c SHA256SUMS.txt)
# KINERA_WORKFLOW_COMPLETE_V81
