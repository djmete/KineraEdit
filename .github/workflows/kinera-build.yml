# Kinera Edit v5.2.0: self-contained workflow.
# No third-party service credentials or signing keys are embedded.
# A persistent signing secret is required; the expected certificate is pinned.
name: Kinera Edit Android APK v5.2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/kinera-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reject incomplete workflow copies
        shell: bash
        run: |
          set -euo pipefail
          grep -qxF '# KINERA_WORKFLOW_COMPLETE_V52' .github/workflows/kinera-build.yml || { echo '::error::Incomplete workflow. Copy the full file including its final marker.'; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify or install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
            if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
              SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            fi
            test -x "$SDKMANAGER"
            missing=()
            [[ -f "$ANDROID_HOME/platforms/android-35/android.jar" ]] || missing+=('platforms;android-35')
            if [[ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]]; then missing+=('build-tools;35.0.0'); fi
            for attempt in 1 2 3; do
              if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "${missing[@]}"; then break; fi
              if [[ "$attempt" == 3 ]]; then echo '::error::Android SDK install failed after three attempts. Check runner SDK availability.'; exit 1; fi
              sleep "$((attempt * 5))"
            done
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore exact Android source
        shell: bash
        run: |
          set -euo pipefail
