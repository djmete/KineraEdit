      - name: Test and compile
        id: apk
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KINERA_KEYSTORE_BASE64 }}
          KINERA_STORE_PASSWORD: ${{ secrets.KINERA_STORE_PASSWORD }}
          KINERA_KEY_ALIAS: ${{ secrets.KINERA_KEY_ALIAS }}
          KINERA_KEY_PASSWORD: ${{ secrets.KINERA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kinera-src"
          bash tests/run.sh
          mkdir -p "$GITHUB_WORKSPACE/dist"
          if [[ -n "$KEYSTORE_BASE64" && -n "$KINERA_STORE_PASSWORD" && -n "$KINERA_KEY_ALIAS" && -n "$KINERA_KEY_PASSWORD" ]]; then
            export KINERA_KEYSTORE="$RUNNER_TEMP/kinera-release.jks"
            trap 'rm -f "$KINERA_KEYSTORE"' EXIT
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KINERA_KEYSTORE"
            gradle --no-daemon --stacktrace :app:assembleRelease :app:lintRelease
            APK=app/build/outputs/apk/release/app-release.apk
            NAME=Kinera_Edit_v1.8.0_release.apk
            echo 'kind=release-signed' >> "$GITHUB_OUTPUT"
          else
            gradle --no-daemon --stacktrace :app:assembleDebug :app:lintDebug
            APK=app/build/outputs/apk/debug/app-debug.apk
            NAME=Kinera_Edit_v1.8.0_test.apk
            echo 'kind=test-signed' >> "$GITHUB_OUTPUT"
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | sed -n '1,8p'
          cp "$APK" "$GITHUB_WORKSPACE/dist/$NAME"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum "$NAME" > SHA256SUMS.txt
      - name: Upload lint diagnostics when available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kinera-v1.8-lint-diagnostics
          path: ${{ runner.temp }}/kinera-src/app/build/reports/lint-results-*
          if-no-files-found: ignore
      - name: Upload compiled APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kinera-Edit-v1.8-APK
          path: dist/*
          if-no-files-found: error
      - name: Publish direct APK download as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_KIND: ${{ steps.apk.outputs.kind }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.8.0-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Kinera Edit v1.8.0 ($BUILD_KIND)" --notes "Compiled and signature-verified by CI. Not yet validated on physical Android devices. Test signing keys may change between builds. No Creator Rewards eligibility guarantee."
