# Kinera Edit v1.1.5 RC: small workflow; source archive committed separately.
# No third-party service credentials or signing keys are embedded.
# A persistent signing secret is required; the expected certificate is pinned.
name: Kinera Edit Android APK v1.1.5-RC
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Commit kinera-source.zip first, then this workflow. Source-only uploads do not trigger CI.
    paths: ['.github/workflows/kinera-build.yml']
concurrency:
  group: kinera-android-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - name: Initialize diagnostics
        id: init
        run: mkdir -p diagnostics
      - name: Reject incomplete workflow copies
        id: workflow_check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          exec > >(tee -a "$GITHUB_WORKSPACE/diagnostics/workflow.log") 2>&1
          trap 'rc=$?; echo "Stage workflow exit code: $rc"; exit "$rc"' EXIT
          grep -qxF '# KINERA_WORKFLOW_COMPLETE_V115_RC' .github/workflows/kinera-build.yml || { echo '::error::Incomplete workflow. Copy the full file including its final marker.'; exit 1; }
      - name: Verify and restore exact Android source
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          exec > >(tee -a "$GITHUB_WORKSPACE/diagnostics/archive.log") 2>&1
          trap 'rc=$?; echo "Stage archive exit code: $rc"; exit "$rc"' EXIT
          SOURCE="$GITHUB_WORKSPACE/kinera-source.zip"
          test -f "$SOURCE" || { echo '::error::Upload kinera-source.zip to the repository root before running this workflow.'; exit 1; }
          EXPECTED='f7861b61b977733d0cc8f490fe3d75b7a6ce1ed26106650ee1e9e85186dcdb6d'
          ACTUAL=$(sha256sum "$SOURCE" | cut -d' ' -f1)
          echo "Expected SHA-256: $EXPECTED"
          echo "Actual SHA-256:   $ACTUAL"
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then echo '::error::Source/workflow mismatch (not a ZIP corruption diagnosis). Commit the matching v1.1.5 kinera-source.zip first, then commit this workflow, or use Run workflow after both match.'; exit 1; fi
          unzip -tq "$SOURCE" || { echo '::error::Source ZIP integrity check failed. Download a fresh package.'; exit 1; }
          mkdir -p "$RUNNER_TEMP/kinera-src"
          unzip -q "$SOURCE" -d "$RUNNER_TEMP/kinera-src"
          test -f "$RUNNER_TEMP/kinera-src/app/build.gradle"
      - uses: actions/setup-java@v4
        id: java_setup
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify or install Android SDK
        id: sdk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          exec > >(tee -a "$GITHUB_WORKSPACE/diagnostics/sdk.log") 2>&1
          trap 'rc=$?; echo "Stage sdk exit code: $rc"; exit "$rc"' EXIT
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [[ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" || ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
            if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
              SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
            fi
            test -x "$SDKMANAGER"
            missing=()
            [[ -f "$ANDROID_HOME/platforms/android-35/android.jar" ]] || missing+=('platforms;android-35')
            if [[ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" || ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt" ]]; then missing+=('build-tools;35.0.0'); fi
            (yes || true) | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
            for attempt in 1 2 3; do
              if "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "${missing[@]}"; then break; fi
              if [[ "$attempt" == 3 ]]; then echo '::error::Android SDK install failed after three attempts. Check runner SDK availability.'; exit 1; fi
              sleep "$((attempt * 5))"
            done
          fi
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
      - uses: gradle/actions/setup-gradle@v4
        id: gradle_setup
        with:
          gradle-version: '8.9'
      - name: Host regression tests
        id: hosttests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          cd "$RUNNER_TEMP/kinera-src"
          java -version 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/java-version.log"
          gradle --version 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/gradle-version.log"
          bash tests/run.sh 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/host-tests.log"
      - name: Configure cache-first Maven resolution (no HTTP probes)
        id: maven
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          cd "$RUNNER_TEMP/kinera-src"
          bash tests/maven_preflight.sh 2>&1 | tee "$GITHUB_WORKSPACE/diagnostics/maven-network.log"
      - name: Assemble unsigned universal release APK
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          exec > >(tee -a "$GITHUB_WORKSPACE/diagnostics/assemble-stage.log") 2>&1
          trap 'rc=$?; echo "Stage assemble-stage exit code: $rc"; exit "$rc"' EXIT
          cd "$RUNNER_TEMP/kinera-src"
          unset KINERA_KEYSTORE KINERA_STORE_PASSWORD KINERA_KEY_PASSWORD KINERA_KEY_ALIAS
          bash tests/gradle_ci.sh "$GITHUB_WORKSPACE/diagnostics/assemble.log" :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload unsigned compilation artifact (diagnostic only, not installable)
        id: unsigned_upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Kinera-v1.1.5-unsigned-diagnostic
          path: ${{ runner.temp }}/kinera-src/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
      - name: Sign and verify universal APK with permanent certificate
        id: apk
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.KINERA_SIGNING_BUNDLE }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          exec > >(tee -a "$GITHUB_WORKSPACE/diagnostics/sign-stage.log") 2>&1
          trap 'rc=$?; echo "Stage sign-stage exit code: $rc"; exit "$rc"' EXIT
          cd "$RUNNER_TEMP/kinera-src"
          if [[ -z "$SIGNING_BUNDLE" ]]; then
            echo '::error::Missing KINERA_SIGNING_BUNDLE repository secret. Configure the permanent signing key before building.'
            exit 1
          fi
          IFS=: read -r KINERA_STORE_PASSWORD KEYSTORE_BASE64 <<< "$SIGNING_BUNDLE"
          test -n "$KINERA_STORE_PASSWORD" && test -n "$KEYSTORE_BASE64"
          echo "::add-mask::$KINERA_STORE_PASSWORD"
          echo "::add-mask::$KEYSTORE_BASE64"
          export KINERA_STORE_PASSWORD
          export KINERA_KEY_PASSWORD="$KINERA_STORE_PASSWORD"
          export KINERA_KEYSTORE="$RUNNER_TEMP/kinera-release.p12"
          umask 077
          trap 'rc=$?; rm -f "$KINERA_KEYSTORE" "$RUNNER_TEMP/kinera-aligned.apk"; echo "Stage signing exit code: $rc"; exit "$rc"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KINERA_KEYSTORE"
          unset SIGNING_BUNDLE KEYSTORE_BASE64
          keytool -list -keystore "$KINERA_KEYSTORE" -storetype PKCS12 -storepass:env KINERA_STORE_PASSWORD -alias kinera >/dev/null
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED=app/build/outputs/apk/release/app-release-unsigned.apk
          "$TOOLS/zipalign" -f -P 16 4 "$UNSIGNED" "$RUNNER_TEMP/kinera-aligned.apk"
          APK="$RUNNER_TEMP/kinera-signed.apk"
          "$TOOLS/apksigner" sign --ks "$KINERA_KEYSTORE" --ks-type PKCS12 --ks-key-alias kinera --ks-pass env:KINERA_STORE_PASSWORD --key-pass env:KINERA_KEY_PASSWORD --out "$APK" "$RUNNER_TEMP/kinera-aligned.apk"
          NAME=Kinera_Edit_v1.1.5_RC_release.apk
          EXPECTED_CERT=47dc21b24c06909c980423fddc2f796269ecf43890de113e0753a6a3eae53e26
          CERT_OUTPUT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK")
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL_CERT=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]')
          if [[ "$ACTUAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo '::error::APK signer does not match the permanent Kinera Edit certificate.'
            exit 1
          fi
          BADGING=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK")
          printf '%s\n' "$BADGING" | sed -n '1,8p'
          printf '%s\n' "$BADGING" | grep -F "package: name='meteapps.kineraedit' versionCode='151' versionName='1.1.5 RC'" > /dev/null
          printf '%s\n' "$BADGING" | grep -qxF "sdkVersion:'31'"
          if printf '%s\n' "$BADGING" | grep -q '^application-debuggable'; then
            echo '::error::Release APK must not be debuggable.'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$APK" "$GITHUB_WORKSPACE/dist/$NAME"
          python3 tests/apk_single_audit.py "$GITHUB_WORKSPACE/dist/$NAME" "$GITHUB_WORKSPACE/dist/APK_SIZE_REPORT.json"
          cd "$GITHUB_WORKSPACE/dist"
          sha256sum "$NAME" APK_SIZE_REPORT.json > SHA256SUMS.txt
          echo 'kind=release-signed' >> "$GITHUB_OUTPUT"
      - name: Upload verified APK as workflow artifact (not a published release)
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Kinera-Edit-v1.1.5-RC-APK
          path: |
            dist/Kinera_Edit_v1.1.5_RC_release.apk
            dist/APK_SIZE_REPORT.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Run Android lint separately before publishing
        id: lint
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/kinera-src"
          bash tests/gradle_ci.sh "$GITHUB_WORKSPACE/diagnostics/lint.log" :app:lintRelease
      - name: Publish direct APK download as prerelease
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_KIND: ${{ steps.apk.outputs.kind }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          exec > >(tee -a "$GITHUB_WORKSPACE/diagnostics/publish.log") 2>&1
          trap 'rc=$?; echo "Stage publish exit code: $rc"; exit "$rc"' EXIT
          TAG="v1.1.5-RC-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" dist/Kinera_Edit_v1.1.5_RC_release.apk dist/APK_SIZE_REPORT.json dist/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Kinera Edit v1.1.5 RC ($BUILD_KIND)" --notes "Compiled and signature-verified by CI. Not yet validated on physical Android devices. One universal APK. Permanent signer verified. Keep signing secret backed up."
          ASSETS=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in Kinera_Edit_v1.1.5_RC_release.apk SHA256SUMS.txt APK_SIZE_REPORT.json; do
            printf '%s\n' "$ASSETS" | grep -qxF "$asset" || { echo "::error::Missing release asset: $asset"; exit 1; }
          done
      - name: Verify build and delivery completed
        id: delivery
        if: ${{ success() }}
        shell: bash
        env:
          COMPILE_RESULT: ${{ steps.apk.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
          LINT_RESULT: ${{ steps.lint.outcome }}
        run: |
          set -euo pipefail
          test "$COMPILE_RESULT" = success
          test "$UPLOAD_RESULT" = success
          test "$LINT_RESULT" = success
          test "$PUBLISH_RESULT" = success
          test -s dist/Kinera_Edit_v1.1.5_RC_release.apk
          test -s dist/APK_SIZE_REPORT.json
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Report every stage and preserve diagnostic tail
        id: diagnostic_summary
        if: ${{ !cancelled() }}
        shell: bash
        env:
          KINERA_STEP_OUTCOMES: '{"checkout":"${{ steps.checkout.outcome }}","init":"${{ steps.init.outcome }}","workflow_check":"${{ steps.workflow_check.outcome }}","java_setup":"${{ steps.java_setup.outcome }}","sdk":"${{ steps.sdk.outcome }}","gradle_setup":"${{ steps.gradle_setup.outcome }}","archive":"${{ steps.archive.outcome }}","hosttests":"${{ steps.hosttests.outcome }}","maven":"${{ steps.maven.outcome }}","assemble":"${{ steps.assemble.outcome }}","unsigned_upload":"${{ steps.unsigned_upload.outcome }}","apk":"${{ steps.apk.outcome }}","upload":"${{ steps.upload.outcome }}","lint":"${{ steps.lint.outcome }}","publish":"${{ steps.publish.outcome }}","delivery":"${{ steps.delivery.outcome }}"}'
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python3 - <<'PYCODE'
          #!/usr/bin/env python3
          import json,os,pathlib,re,sys
          root=pathlib.Path(sys.argv[1] if len(sys.argv)>1 else 'diagnostics');root.mkdir(parents=True,exist_ok=True)
          try: outcomes=json.loads(os.environ.get('KINERA_STEP_OUTCOMES','{}'))
          except json.JSONDecodeError: outcomes={}
          lines=['KINERA CI stage outcomes:']+[f'{k}: {v}' for k,v in outcomes.items()]
          failed=[k for k,v in outcomes.items() if v in ('failure','cancelled')]
          required=('assemble','apk','upload','lint','publish','delivery')
          complete=all(outcomes.get(k)=='success' for k in required) and not failed
          lines+=['Result: '+('APK built, signed, verified and delivered.' if complete else 'Failed or incomplete delivery.')]
          lines+=['Failed stage(s): '+(', '.join(failed) if failed else 'None — delivery succeeded.' if complete else 'None reported; check skipped steps or initialization.')]
          pattern=re.compile(r'error:|error |exception|failed|failure|could not|missing|mismatch|not found|denied|timed out|HTTP [45]\d\d',re.I)
          for p in sorted(root.glob('*.log')):
           data=p.read_text(errors='replace').splitlines();hits=[x for x in data if pattern.search(x)]
           attempts=[x for x in data if x.startswith('KINERA_GRADLE_ATTEMPT ')]
           recovered=bool(attempts and attempts[-1].endswith('exit=0') and any(not x.endswith('exit=0') for x in attempts[:-1]))
           lines += [f'\n[{p.name}]',*attempts]
           if recovered: lines += ['Recovered attempt(s): cache/network retry succeeded; earlier failure lines are historical, not a final error.']
           if not complete and not recovered: lines += ['Matching lines:',*hits[-35:]]
           lines += ['Last log lines:',*data[-25:]]
          report='\n'.join(lines)+'\n';(root/'FIRST_ERROR.txt').write_text(report)
          (root/'CI_STATUS.json').write_text(json.dumps({'delivery_success':complete,'failed_stages':failed,'outcomes':outcomes},indent=2)+'\n')
          print(report[-18000:]);summary=os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
           with open(summary,'a') as f:f.write('### Kinera CI diagnostics\n```text\n'+report[-18000:]+'\n```\n')
          PYCODE
      - name: Upload diagnostic logs and stage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: Kinera-v1.1.5-build-diagnostics
          path: |
            diagnostics/
            ${{ runner.temp }}/kinera-src/app/build/reports/lint-results-*
          if-no-files-found: warn
# KINERA_WORKFLOW_COMPLETE_V115_RC
